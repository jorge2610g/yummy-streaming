<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Catálogo Streaming</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090b12;--card:#111522;--soft:#171c2b;--line:#262d3d;--txt:#f8fafc;--mut:#a6afc0;--a:#8b5cf6;--a2:#c084fc;--ok:#34d399}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 85% 0,#8b5cf620,transparent 30%),var(--bg);color:var(--txt);min-height:100vh}
button,a{font:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#090b12e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:21px}.logo{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#fff}.logoFallback{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));font-weight:950}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:11px;padding:10px 13px;text-decoration:none;font-weight:850;cursor:pointer}
.hero{padding:54px 0 24px}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.12em;color:var(--a2)}h1{font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-2.5px;margin:12px 0 16px}.lead{color:var(--mut);font-size:17px;line-height:1.6;max-width:650px}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 20px}.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px 13px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--txt);font:inherit}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:42px}.product{display:flex;flex-direction:column;border:1px solid var(--line);background:linear-gradient(145deg,#131826,#0e121d);border-radius:20px;padding:17px;min-height:240px}.productTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#ffffff0b;font-size:24px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0b;font-size:11px;font-weight:900}.ok{color:var(--ok)}h3{font-size:21px;margin:13px 0 5px}.mut{color:var(--mut)}.priceRow{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:18px}.price{font-size:24px;font-weight:950}.price small{display:block;font-size:11px;color:var(--mut);font-weight:700}.buy{border:0;border-radius:12px;background:var(--a);color:#fff;padding:11px 14px;font-weight:950;cursor:pointer;text-decoration:none}.empty,.error{grid-column:1/-1;padding:34px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}.footer{padding:25px 0 34px;text-align:center;color:var(--mut);font-size:12px}.loading{padding:80px 0;text-align:center;color:var(--mut)}
@media(max-width:880px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{width:min(100% - 20px,1120px)}.grid{grid-template-columns:1fr}.hero{padding-top:36px}.product{min-height:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand" id="brand"><span class="logoFallback">Y</span><span>Streaming</span></div><div class="actions"><a class="btn" id="whatsappTop" href="#" target="_blank" rel="noopener">WhatsApp</a></div></div></header>
<main>
<section class="hero"><div class="wrap"><div class="eyebrow">CATÁLOGO DE STREAMING</div><h1 id="businessName">Catálogo</h1><p class="lead">Elige la plataforma que necesitas y consulta la disponibilidad.</p></div></section>
<section><div class="wrap"><div class="toolbar"><div class="search">⌕ <input id="searchInput" type="search" placeholder="Buscar plataforma..." autocomplete="off"></div></div><div class="grid" id="catalogGrid"><div class="loading">Cargando catálogo…</div></div></div></section>
</main>
<footer class="footer"><div class="wrap">Powered by YummyPro · v1.1.4</div></footer>
<script>
const SB_URL="https://gulctljitzlwokqydigx.supabase.co";
const SB_KEY="sb_publishable__moppTxObowifx6rJbW_tw_3GiCkqhG";
const sb=supabase.createClient(SB_URL,SB_KEY);
let catalog={business:null,products:[]};
const params=new URLSearchParams(location.search),businessId=Number(params.get('business')||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function iconFor(name){const n=String(name||'').toLowerCase();if(n.includes('netflix'))return '📺';if(n.includes('disney'))return '✨';if(n.includes('prime'))return '▶️';if(n.includes('spotify'))return '🎵';if(n.includes('youtube'))return '▶';if(n.includes('max'))return '🎞️';return '🎬'}
function money(v){const b=catalog.business||{},n=Number(v||0);if(!n)return 'Consultar';try{return new Intl.NumberFormat(b.locale||'es-CL',{style:'currency',currency:b.currency_code||'CLP',maximumFractionDigits:0}).format(n)}catch(_){return String(n)}}
function waUrl(product){const b=catalog.business||{},phone=String(b.whatsapp||'').replace(/\D/g,''),text='Hola, quiero consultar por '+product.name+'.';return phone?'https://wa.me/'+phone+'?text='+encodeURIComponent(text):'#'}
function applyBrand(){const b=catalog.business||{};document.title=(b.name||'Catálogo')+' · Streaming';document.getElementById('businessName').textContent=b.name||'Catálogo Streaming';const brand=document.getElementById('brand');brand.innerHTML=(b.logo_url?'<img class="logo" src="'+esc(b.logo_url)+'" alt="">':'<span class="logoFallback">'+esc((b.name||'Y').charAt(0).toUpperCase())+'</span>')+'<span>'+esc(b.name||'Streaming')+'</span>';const wa=document.getElementById('whatsappTop'),phone=String(b.whatsapp||'').replace(/\D/g,'');if(phone)wa.href='https://wa.me/'+phone;else wa.style.display='none';if(b.theme_primary_color)document.documentElement.style.setProperty('--a',b.theme_primary_color);if(b.theme_secondary_color)document.documentElement.style.setProperty('--a2',b.theme_secondary_color)}
function render(){const q=(document.getElementById('searchInput').value||'').trim().toLowerCase(),rows=(catalog.products||[]).filter(p=>!q||String(p.name||'').toLowerCase().includes(q));document.getElementById('catalogGrid').innerHTML=rows.map(p=>'<article class="product"><div class="productTop"><div class="icon">'+iconFor(p.name)+'</div><span class="pill '+(Number(p.free_slots)>0?'ok':'')+'">'+(Number(p.free_slots)>0?Number(p.free_slots)+' cupos':'Consultar')+'</span></div><h3>'+esc(p.name)+'</h3><div class="mut">'+Number(p.default_duration_days||30)+' días de servicio</div><div class="priceRow"><div class="price"><small>Precio</small>'+esc(money(p.sale_price))+'</div><a class="buy" href="'+esc(waUrl(p))+'" target="_blank" rel="noopener">Solicitar</a></div></article>').join('')||'<div class="empty">No hay plataformas disponibles en este momento.</div>'}
async function load(){if(!businessId){document.getElementById('catalogGrid').innerHTML='<div class="error">No se encontró el negocio.</div>';return}const {data,error}=await sb.rpc('streaming_public_catalog',{p_restaurant_id:businessId});if(error||!data?.business){document.getElementById('catalogGrid').innerHTML='<div class="error">No se pudo cargar este catálogo.</div>';return}catalog=data;applyBrand();render()}
document.getElementById('searchInput').addEventListener('input',render);load();
</script>
</body>
</html>
