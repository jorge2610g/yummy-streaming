name: Activar Streaming v0.7.0
on:
  push:
    paths:
      - '.github/workflows/streaming-v070-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar recordatorios y version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panel/index.html')
          s=p.read_text()
          s=s.replace('Streaming · Versión v0.6.0','Streaming · Versión v0.7.0')
          tag='<script src="/panel/streaming-reminders.js?v=0700"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "feat(streaming): activar recordatorios v0.7.0"
            git push
          fi
