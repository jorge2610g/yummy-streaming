name: Aplicar cobros Streaming v0.4.0

on:
  push:
    paths:
      - '.github/workflows/add-streaming-payments-v0400-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche
        run: python scripts/apply_streaming_payments_v0400.py
      - name: Guardar cambios
        run: |
          rm -f .github/workflows/add-streaming-payments-v0400-once.yml
          rm -f scripts/apply_streaming_payments_v0400.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(streaming): control de cobros por suscripción v0.4.0"
          git push
