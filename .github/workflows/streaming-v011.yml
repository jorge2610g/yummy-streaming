name: Preparar panel Streaming v0.1.1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/streaming-v011.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar separación del módulo Streaming
        run: python scripts/patch_streaming_v011.py
      - name: Guardar panel v0.1.1
        run: |
          git config user.name "YummyPro Automation"
          git config user.email "actions@users.noreply.github.com"
          git add panel/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(streaming): separar panel y navegación v0.1.1"
          git push
