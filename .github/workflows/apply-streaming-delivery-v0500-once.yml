name: Aplicar entrega Streaming v0.5.0
on:
  push:
    paths:
      - '.github/workflows/apply-streaming-delivery-v0500-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar integración
        run: python scripts/apply_streaming_delivery_v0500.py
      - name: Guardar cambios
        run: |
          rm -f scripts/apply_streaming_delivery_v0500.py .github/workflows/apply-streaming-delivery-v0500-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/index.html panel/demo.html panel/streaming-delivery.js tests/streaming-check.mjs tests/streaming.spec.js package.json package-lock.json scripts/apply_streaming_delivery_v0500.py .github/workflows/apply-streaming-delivery-v0500-once.yml
          git commit -m "feat(streaming): entrega y activacion v0.5.0"
          git push
