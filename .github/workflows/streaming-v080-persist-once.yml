name: Activar Streaming v0.8.0
on:
  push:
    paths:
      - '.github/workflows/streaming-v080-persist-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpiar cargador y actualizar pruebas
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('panel/index.html')
          s=p.read_text()
          for v in ('0700','0800'):
              s=s.replace(f'<script src="/panel/streaming-reminders.js?v={v}"></script>','')
          s=s.replace('Streaming · Versión v0.7.0','Streaming · Versión v0.8.0')
          marker='</body></html>'
          pos=s.rfind(marker)
          if pos < 0:
              raise SystemExit('No se encontró cierre HTML principal')
          s=s[:pos]+'<script src="/panel/streaming-reminders.js?v=0800"></script>\n'+s[pos:]
          p.write_text(s)

          t=Path('tests/streaming.spec.js')
          x=t.read_text()
          x=x.replace("recordatorios Streaming v0.7.0 estan publicados","recordatorios Streaming v0.8.0 estan publicados y persistentes")
          x=x.replace("/panel/streaming-reminders.js?v=0700","/panel/streaming-reminders.js?v=0800")
          x=x.replace("recordatorios operativos v0.7.0","recordatorios persistentes v0.8.0")
          x=x.replace("expect(body).toContain('La cola se calcula sola');", "expect(body).toContain('streaming_reminder_logs');\n  expect(body).toContain('streamingLoadReminderLogs');\n  expect(body).toContain('Gestionado hoy');\n  expect(body).not.toContain('localStorage');")
          if "panel carga recordatorios una sola vez" not in x:
              x += "\n\ntest('panel carga recordatorios una sola vez', async ({ request }) => {\n  const response = await request.get('/panel/');\n  expect(response.ok()).toBeTruthy();\n  const body = await response.text();\n  expect(body).toContain('Streaming · Versión v0.8.0');\n  const matches=body.match(/\\/panel\\/streaming-reminders\\.js\\?v=0800/g)||[];\n  expect(matches).toHaveLength(1);\n});\n"
          t.write_text(x)
          PY
      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/index.html tests/streaming.spec.js
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "feat(streaming): activar recordatorios persistentes v0.8.0"
            git push
          fi
