name: Activar Streaming v0.6.0
on:
  push:
    paths:
      - '.github/workflows/streaming-v060-cache-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar version y cache busting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panel/index.html')
          s=p.read_text()
          s=s.replace('Streaming · Versión v0.5.0','Streaming · Versión v0.6.0')
          s=s.replace('/panel/streaming-delivery.js?v=0500','/panel/streaming-delivery.js?v=0600')
          p.write_text(s)

          t=Path('tests/streaming-check.mjs')
          s=t.read_text()
          s=s.replace("'Streaming · Versión v0.5.0'","'Streaming · Versión v0.6.0'")
          s=s.replace("'/panel/streaming-delivery.js?v=0500'","'/panel/streaming-delivery.js?v=0600'")
          t.write_text(s)
          PY
      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/index.html tests/streaming-check.mjs
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "chore(streaming): activar v0.6.0 y cache busting"
            git push
          fi
